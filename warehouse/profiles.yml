# DuckDB is the default warehouse. Swapping to Snowflake is a one-target change:
# add a `snowflake` output below and flip `target`. Keep mart SQL portable.
olist:
  target: dev
  outputs:
    dev:
      type: duckdb
      # defaults to the local warehouse; tests/CI override DUCKDB_PATH to a temp file
      path: "{{ env_var('DUCKDB_PATH', 'olist.duckdb') }}"
      # DuckDB is a single-writer embedded file; >1 thread crashes on concurrent
      # connection teardown (SIGABRT in dbt-duckdb's local.py close()). Keep at 1.
      threads: 1
      schema: main
