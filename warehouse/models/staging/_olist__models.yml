version: 2

models:
  - name: stg_olist__orders
    description: Cleaned orders, one row per order_id, timestamps typed.
    columns:
      - name: order_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: customer_id
        description: FK to stg_olist__customers (per-order customer key).
        data_tests: [not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]

  - name: stg_olist__order_items
    description: One row per item line within an order.
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: seller_id
        data_tests: [not_null]
      - name: price
        data_tests: [not_null]

  - name: stg_olist__order_payments
    description: One row per payment record.
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: payment_type
        data_tests: [not_null]

  - name: stg_olist__order_reviews
    description: Customer reviews per order.
    columns:
      - name: review_id
        data_tests: [not_null]
      - name: review_score
        data_tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: stg_olist__customers
    description: Per-order customer; customer_unique_id ties repeat buyers.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]

  - name: stg_olist__products
    description: Product catalog with corrected dimension column names.
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_olist__sellers
    description: Seller registry.
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_olist__geolocation
    description: One representative centroid per zip-code prefix.
    columns:
      - name: zip_code_prefix
        data_tests: [unique, not_null]

  - name: stg_olist__product_category_translation
    description: Portuguese -> English category names.
    columns:
      - name: product_category_name
        data_tests: [unique, not_null]
